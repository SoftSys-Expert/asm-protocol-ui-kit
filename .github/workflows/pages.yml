name: Deploy Histoire to GitHub Pages

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Histoire
        env:
          HISTOIRE_BASE: /asm-protocol-ui-kit/
        run: npm run story:build
      - name: SPA fallback for GitHub Pages routing
        run: |
          cat > .histoire/dist/404.html << 'HTML'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <script>
              // SPA-фолбэк: GitHub Pages отдаёт 404.html на любой неизвестный путь
              var base = '/asm-protocol-ui-kit/';
              var path = location.pathname.replace(/^\/asm-protocol-ui-kit\/?/, '');
              if (path && path !== '404.html') {
                location.replace(base + 'index.html#/story/' + path);
              } else {
                location.replace(base);
              }
            </script>
          </head>
          <body></body>
          </html>
          HTML
      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .histoire/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
